<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- Rounded Shield / Capsule Icon -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0f2b5c" />
  <!-- Medical Cross Horizontal Bar -->
  <rect x="10" y="19" width="28" height="10" rx="3" fill="#ffffff" />
  <!-- Medical Cross Vertical Bar -->
  <rect x="19" y="10" width="10" height="28" rx="3" fill="#ffffff" />
  <!-- Vibrant Medical Cyan Accent Inset -->
  <circle cx="24" cy="24" r="3.5" fill="#0284c7" />
  <!-- Diagonal Rx Slit Accent -->
  <path d="M14 14L18 18M30 30L34 34" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Wordmark Text: RxCare -->
  <text x="56" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f2b5c" letter-spacing="-0.5">
    Rx<tspan fill="#0284c7">Care</tspan>
  </text>
  <!-- Subtitle: Hospital Pharmacy -->
  <text x="57" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="1.2">
    HOSPITAL PHARMACY
  </text>
</svg>
