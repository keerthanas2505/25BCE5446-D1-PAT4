<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In - RxCare Hospital Pharmacy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-container">
        <img src="{{ url_for('static', filename='images/rxcare-logo.svg') }}" alt="RxCare Hospital Pharmacy Logo" class="login-brand-logo">
      </div>
      <h1>Staff Portal Sign In</h1>
      <p>Authorized Clinical & Dispensary Personnel Only</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          value="{{ username or '' }}" 
          placeholder="Enter staff username" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="Enter secure password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 8px; font-weight: 600;">
        Sign In to Portal
      </button>
    </form>

    <div class="login-public-return">
      <a href="{{ url_for('public.home') }}" class="return-home-link">&larr; Return to RxCare Public Website</a>
    </div>
  </div>
</body>
</html>
